<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Upload Image</title></head>
  <body>
    <h1>上传图片进行处理</h1>
    <form method="post" enctype="multipart/form-data" action="/process">

      <button type="submit">上传并处理</button>
    </form>
  </body>
</html>
